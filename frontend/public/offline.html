  <title>Qmail — You're offline</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #f2f6fc; color: #172744; }

    h1 { font-size: 32px; letter-spacing: -.04em; }

    a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }

  </style>
</head>
<body><main><p>Qmail</p><h1>You're offline.</h1><p>Reconnect to read and send email. For your privacy, Qmail does not cache your messages or attachments for offline access.</p><a href="/">Try again</a></main></body>
